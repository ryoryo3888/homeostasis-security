<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOMEOSTASIS SECURITY UI Compare</title><style>html,body{margin:0;background:#020913;color:#edf7fb;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(2,9,19,.96);border-bottom:1px solid rgba(103,232,249,.22)}.bar strong{color:#67e8f9}.bar button{border:1px solid rgba(103,232,249,.25);background:#081827;color:#cbe8ef;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}.bar button.active{border-color:#67e8f9;background:#124457;color:white}.note{margin-left:auto;color:#8eaab7;font-size:12px}.stage{height:calc(100vh - 55px)}iframe{width:100%;height:100%;border:0;background:#030b14}</style></head><body><div class="bar"><strong>HOMEOSTASIS SECURITY / UI SYSTEM PREVIEW</strong><button id="v1" class="active">V1</button><button id="v2">V2</button><span class="note"></span></div><div class="stage"><iframe id="view" title="UI preview"></iframe></div><script>
const branch='homeostasis-ui-system-20260916';
const base='https://raw.githubusercontent.com/ryoryo3888/homeostasis-security/'+branch+'/';
const cssUrl=base+'homeostasis-ui-system.css';
const frame=document.getElementById('view');
async function show(version){
  document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.id===version));
  const html=await fetch(base+'dashboard_'+version+'.html',{cache:'no-store'}).then(r=>r.text());
  const css=await fetch(cssUrl,{cache:'no-store'}).then(r=>r.text());
  const patched=html.replace('</head>','<style>\n'+css+'\n</style></head>');
  frame.srcdoc=patched;
}
document.getElementById('v1').onclick=()=>show('v1');document.getElementById('v2').onclick=()=>show('v2');show('v1');
</script></body></html>
