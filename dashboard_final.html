rd('紛争負荷',D.load[i])}</div><article class="card"><h2>地球調整機関</h2><p>提案: ${i<3?'食料援助':'復興支援'}／状態: ${i===1?'部分成立':'成立'}</p><p>独立評価機関（Evaluator）は予測値ではなく実行後状態を独立評価しています。</p></article></div>`;if(tab===3)content.innerHTML=`<div class="content-stack"><article class="card"><h2>統治ルール</h2><p>ルールセット v2：資源共有制度。成立前ルールで審査し、成立した変更だけを次ターンから適用。</p></article><div class="grid">${card('成立根拠','独立回答')}${card('緊急権限','期限付き')}${card('遡及変更','なし')}${card('主権負担',Math.max(0,8-i))}</div></div>`;if(tab===4)content.innerHTML=`<div class="content-stack"><article class="card"><h2>有向資源ネットワーク</h2><p class="flow">資源輸出国 → 食料輸入国 ← 中立国<br>経済大国 → 紛争脆弱国<br>島嶼国 → 小国</p></article><div class="grid">${card('資源種別',7)}${card('供給経路',6)}${card('保存則','確認済み')}${card('農地残存損傷',D.damage[i].toLocaleString()+' t')}</div></div>`;if(tab===5)content.innerHTML=`<div class="content-stack"><div class="grid"><article class="card"><h2>因果・行動ログ</h2><ol>${D.causes.map((x,n)=>`<li${n===i?' class="status"':''}>ターン${n+1}: ${x}</li>`).join('')}</ol></article><article class="card"><h2>複数実行集計</h2><p>1回実行 / 回復率 100% / 最終恒常性 84 / 標準偏差 0</p><p>決定論的試作。最終結果: recovered</p></article></div><article class="card"><h2>指標推移</h2><p>恒常性 ${D.homeostasis.join(' → ')} ／ 主権 ${D.sovereignty.join(' → ')} ／ 農地被害 ${D.damage.map(x=>x.toLocaleString()).join(' → ')} t</p></article></div>`}show();
