<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOMEOSTASIS SECURITY — Final</title><style>
:root{--bg:#071421;--panel:#10263a;--cyan:#82e7ff;--pink:#ff9ddd;--text:#edf8ff;--muted:#a9c5d5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#173b55,var(--bg) 48%);color:var(--text);font-family:system-ui,sans-serif}header,main{max-width:1200px;margin:auto;padding:20px}nav a{color:var(--cyan);margin-right:18px}.hero{border:1px solid #39718d;border-radius:20px;padding:24px;background:#0b1d2dcc}.eyebrow{color:var(--pink);letter-spacing:.14em}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{background:#17364c;color:var(--text);border:1px solid #4d7890;padding:10px 14px;border-radius:999px}.tabs button.active{background:var(--cyan);color:#05202d}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:var(--panel);border:1px solid #284f66;border-radius:14px;padding:16px}.metric{font-size:2rem;color:var(--cyan)}.pink{color:var(--pink)}select{background:#10263a;color:white;padding:8px}ol{line-height:1.8}@media(max-width:600px){header,main{padding:12px}.hero{padding:16px}}

<script id="data" type="application/json">{"damage":[8000,6000,4000,2000,0],"homeostasis":[68,72,76,80,84],"sovereignty":[88,87,86,85,84],"conflict":[30,24,18,12,6],"food":[72,75,78,81,84],"energy":[79,79,79,79,79],"economy":[74,76,78,80,82],"environment":[76,76,76,76,76],"trust":[70,73,76,79,82],"load":[28,24,20,16,12],"countries":["MIL","RES","FOOD","SMALL","ISLAND","ECON","FRAGILE","NEUTRAL"],"causes":["ミサイル着弾","農地被害と供給低下","輸入需要と市場圧力","第三国影響と外交摩擦","調整介入と復旧"]}</script><script>
const D=JSON.parse(document.querySelector('#data').textContent), names=['概要','国家','地球','資源','ログ／研究結果'];const tabs=document.querySelector('#tabs'),content=document.querySelector('#content'),turn=document.querySelector('#turn');D.damage.forEach((_,i)=>turn.add(new Option(`Turn ${i+1}`,i)));names.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>show(i);tabs.append(b)});turn.onchange=()=>show([...tabs.children].findIndex(x=>x.classList.contains('active')));function card(k,v,c=''){return `<article class="card"><small>${k}</small><div class="metric ${c}">${v}</div></article>`}function show(tab=0){[...tabs.children].forEach((b,i)=>b.classList.toggle('active',i===tab));let i=+turn.value;if(tab===0)content.innerHTML=`<div class="grid">${card('地球恒常性',D.homeostasis[i])}${card('国家主権',D.sovereignty[i],'pink')}${card('衝突度',D.conflict[i])}${card('農地被害',D.damage[i]+' t')}</div>`;if(tab===1)content.innerHTML=`<div class="grid">${D.countries.map((c,n)=>card(c,`認識鮮度 ${95-n*6}<br><small>判断: 協調／回答: 受諾<br>履歴を保持</small>`)).join('')}</div>`;if(tab===2)content.innerHTML=`<div class="grid">${card('食料',D.food[i])}${card('エネルギー',D.energy[i])}${card('経済',D.economy[i])}${card('環境',D.environment[i])}${card('国際信頼',D.trust[i])}${card('紛争負荷',D.load[i])}</div><div class="card"><h2>地球調整機関</h2><p>提案: 食料援助／復興支援　成立結果は実績だけを反映。</p><p>${D.causes[i]}</p></div>`;if(tab===3)content.innerHTML=`<div class="card"><h2>有向資源ネットワーク</h2>食料・化石燃料・再生可能・原子力・送電／蓄電・資金・物流<br>供給元 → 輸入国 → 第三国、保存則検証済み</div>`;if(tab===4)content.innerHTML=`<div class="grid"><div class="card"><h2>因果・行動ログ</h2><ol>${D.causes.map(x=>`<li>${x}</li>`).join('')}</ol></div><div class="card"><h2>複数run集計</h2><p>1 run / 回復率 100% / 最終恒常性 84 / 標準偏差 0</p><p>決定論的試作run。最終結果: recovered</p></div></div>`}show();
</script></body></html>
