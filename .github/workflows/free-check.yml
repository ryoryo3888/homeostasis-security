name: HOMEOSTASIS API-free preflight
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned SDK for network-blocked transport tests
        run: python -m pip install -r requirements-gemini.txt
      - name: Offline syntax, all tests and emergent eight-turn preflight
        run: make check
      - name: Verify public observation files and publication gate
        run: make verify-status
      - name: Real browser observatory checks (saved data only)
        run: make observatory-check
      - name: Build sanitized read-only observatory
        run: make observatory-build
      - uses: actions/upload-artifact@v4
        with:
          name: worldline-observatory
          path: dist/observatory/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-preflight
          path: results/debug/check.json
