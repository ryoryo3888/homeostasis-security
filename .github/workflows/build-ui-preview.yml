name: Build unified UI previews

on:
  push:
    branches:
      - homeostasis-ui-system-20260916
    paths:
      - dashboard_v1.html
      - dashboard_v2.html
      - homeostasis-ui-system.css
      - homeostasis-research-layer.css
      - homeostasis-research-layer.js
      - homeostasis-research-integration.js
      - tools/build_ui_previews.py
      - .github/workflows/build-ui-preview.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homeostasis-ui-system-20260916
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify research JavaScript
        run: |
          node --check homeostasis-research-layer.js
          node --check homeostasis-research-integration.js
      - name: Build integrated dashboards and previews
        run: python tools/build_ui_previews.py
      - name: Verify integrated artifacts
        run: |
          test -s dashboard_v1.html
          test -s dashboard_v2.html
          test -s preview_v1_unified.html
          test -s preview_v2_unified.html
          for f in dashboard_v1.html dashboard_v2.html preview_v1_unified.html preview_v2_unified.html; do
            grep -q 'HOMEOSTASIS_UI_SYSTEM_PREVIEW' "$f"
            grep -q 'HOMEOSTASIS_RESEARCH_NARRATIVE_PREVIEW' "$f"
            grep -q 'HOMEOSTASIS_RESEARCH_INTEGRATION' "$f"
          done
          grep -q 'V1で起きた農地への着弾' dashboard_v1.html
          grep -q 'なぜV2が生まれた' dashboard_v2.html
      - name: Commit verified artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard_v1.html dashboard_v2.html preview_v1_unified.html preview_v2_unified.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Promote integrated research dashboards'
            git push origin HEAD:homeostasis-ui-system-20260916
          fi