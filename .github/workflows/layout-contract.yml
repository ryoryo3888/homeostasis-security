name: Visual constitution free preflight
on:
  pull_request:
  push:
    branches: [main, 'visual-layout-contract-*']
permissions:
  contents: read
jobs:
  layout-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: System Chrome with runner sandbox support
        run: /usr/bin/google-chrome --version
      - run: python -m pip install -r requirements/free-check.txt
      - name: Free tests, build, secret scan and layout contracts
        env:
          CHROME_BIN: /usr/bin/google-chrome
          PYTHONDONTWRITEBYTECODE: '1'
        run: make check
      - name: Generated dashboard consistency
        run: git diff --exit-code -- dashboard_v1.html dashboard_v2.html preview_v1_unified.html preview_v2_unified.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-contract-evidence
          path: .artifacts/layout/
