name: Public record boundary
on: [push, pull_request]
permissions:
  contents: read
jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public files without API or private configuration
        run: python tools/check_public_boundary.py
